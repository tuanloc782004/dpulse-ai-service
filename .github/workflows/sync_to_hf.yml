name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên giao diện GitHub nếu muốn

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Thay thế "tai_khoan_hf/ten_spaces_cua_ban" bằng thông tin chính xác của bạn
        run: git push --force https://USERNAME:$HF_TOKEN@huggingface.co/spaces/tuanloc78/dpulse-ai-service
